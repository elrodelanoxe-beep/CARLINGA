(()=>{
'use strict';
/* =========================================================
   CARLINGA — Mundo 1-1

const T=16, VH=176, LW=244, LH=11, A0=216, CHECK_X=79*T, CHECK2=210*T, FLYMAX=150, CT=140, MIDC=1250, FARC=620, CONC_X=109*T, ACAD_X=123*T;
let VW=320;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');

/* ---------- utilidades ---------- */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;if(fn)fn(g,c);return c;}
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function ell(g,cx,cy,rx,ry,c){for(let y=-ry;y<=ry;y++)for(let x=-rx;x<=rx;x++)if((x*x)/(rx*rx+.01)+(y*y)/(ry*ry+.01)<=1)R(g,cx+x,cy+y,1,1,c);}
function flipImg(g,img,x,y,flip){if(!flip){g.drawImage(img,x,y);return;}g.save();g.translate(x+img.width,y);g.scale(-1,1);g.drawImage(img,0,0);g.restore();}

/* ---------- fuente 5x7 ---------- */
const FD={A:[14,17,17,31,17,17,17],B:[30,17,17,30,17,17,30],C:[14,17,16,16,16,17,14],D:[30,17,17,17,17,17,30],E:[31,16,16,30,16,16,31],
F:[31,16,16,30,16,16,16],G:[14,17,16,23,17,17,15],H:[17,17,17,31,17,17,17],I:[14,4,4,4,4,4,14],J:[7,2,2,2,2,18,12],K:[17,18,20,24,20,18,17],
L:[16,16,16,16,16,16,31],M:[17,27,21,21,17,17,17],N:[17,25,21,19,17,17,17],O:[14,17,17,17,17,17,14],P:[30,17,17,30,16,16,16],Q:[14,17,17,17,21,18,13],
R:[30,17,17,30,20,18,17],S:[15,16,16,14,1,1,30],T:[31,4,4,4,4,4,4],U:[17,17,17,17,17,17,14],V:[17,17,17,17,17,10,4],W:[17,17,17,21,21,21,10],
X:[17,17,10,4,10,17,17],Y:[17,17,10,4,4,4,4],Z:[31,1,2,4,8,16,31],
'0':[14,17,19,21,25,17,14],'1':[4,12,4,4,4,4,14],'2':[14,17,1,2,4,8,31],'3':[31,2,4,2,1,17,14],'4':[2,6,10,18,31,2,2],'5':[31,16,30,1,1,17,14],
'6':[6,8,16,30,17,17,14],'7':[31,1,2,4,8,8,8],'8':[14,17,17,14,17,17,14],'9':[14,17,17,15,1,2,12],
'!':[4,4,4,4,4,0,4],'¡':[4,0,4,4,4,4,4],'?':[14,17,1,2,4,0,4],'¿':[4,0,4,8,16,17,14],'.':[0,0,0,0,0,12,12],',':[0,0,0,0,12,4,8],
':':[0,12,12,0,12,12,0],'-':[0,0,0,31,0,0,0],"'":[4,4,8,0,0,0,0],'×':[0,17,10,4,10,17,0],'/':[1,1,2,4,8,16,16],'♥':[0,10,31,31,14,4,0],'♪':[6,5,4,4,12,28,8],
'★':[4,4,31,14,14,27,0],'>':[8,4,2,1,2,4,8],'(':[2,4,8,8,8,4,2],')':[8,4,2,2,2,4,8],'▼':[0,31,31,14,14,4,0],'+':[0,4,4,31,4,4,0]};
const ACC={'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ñ':'N','Ü':'U'};
function txt(g,s,x,y,c,k=1,sh=null){
  s=String(s).toUpperCase();
  if(sh) txt(g,s,x+k,y+k,sh,k,null);
  g.fillStyle=c;let cx=x;
  for(const ch of s){
    const d=FD[ACC[ch]||ch];
    if(d)for(let r=0;r<7;r++){const row=d[r];for(let b=0;b<5;b++)if(row&(16>>b))g.fillRect(cx+b*k,y+r*k,k,k);}
    if(ch==='Ñ'){g.fillRect(cx+k,y-2*k,2*k,k);g.fillRect(cx+3*k,y-k*1.5|0,k,k);}
    else if(ch==='Ü'){g.fillRect(cx+k,y-2*k,k,k);g.fillRect(cx+3*k,y-2*k,k,k);}
    else if(ACC[ch]){g.fillRect(cx+2*k,y-2*k,k,k);g.fillRect(cx+3*k,y-3*k,k,k);}
    cx+=6*k;
  }
}
const tw=(s,k=1)=>String(s).length*6*k-k;
function txtC(g,s,cx,y,c,k=1,sh='#000'){txt(g,s,Math.round(cx-tw(s,k)/2),y,c,k,sh);}

/* ---------- plantillas de sprites ---------- */
function tpl(g,rows,pal,ox=0,oy=0){
  for(let y=0;y<rows.length;y++){const r=rows[y];for(let x=0;x<r.length;x++){const ch=r[x];if(ch==='.')continue;let c=pal[ch];
    if(typeof c==='function')c=c(x,y+oy);if(!c)continue;g.fillStyle=c;g.fillRect(ox+x,oy+y,1,1);}}
}
const SK='#f6c6a0',SK2='#dc9c7c',HR='#5a3018';
// Carla: cabeza y torso (filas 0-16)
const CUP=["................","......HHHH......","....HHHHHHHH....","...HHHHHHHHHH...","...HHHHHHHHHHH..","..HHHHHSHHSSSH..",
"..HHHHSSSSSESS..","..HHHsSSSSSESS..","..HHHHSSSSSSCS..","..HHHH.SSSSMS...","..HHH...SSS.....","..HHTTTTTTTT....","..HTTTTTTTTT....",
"...TTTTTAATT....","....TTTTAATT....","....TTTTAATT....","....TTTTSSTT...."];

["....PPPPPPPP....","....PPP..PPP....","....PPP..PPP....","....PPP..PPP....","....PPP..PPP....","....KKK..KKKK...","....KKK..KKKK..."],
["....PPPPPPPP....","...PPP...PPP....","...PPP....PPP...","..PPP.....PPP...","..PPP......PPP..",".KKK.......KKKK.",".KKK.......KKKK."],
["....PPPPPPPP....",".....PPPPPP.....",".....PPPPPP.....",".....PPP.PPP....",".....PPP.KKKK...",".....KKKK.......","................"],
["....PPPPPPPP....","...PPP...PPP....","..PPP....PPP....",".KKK....PPP.....",".KKK....KKKK....","................","................"]];

["....PPPPPPPP....","...PPPPPPPPPP...","...PPPPPPPPPP...",".....LL..LL.....",".....QQ..QQ.....",".....KKK.KKK....",".....KKK.KKK...."],
["....PPPPPPPP....","...PPPPPPPPPP...","..PPPPPPPPPPPP..","...LL......LL...","..QQ........QQ..",".KKK........KKK.","................"],
["....PPPPPPPP....","...PPPPPPPPPP...","...PPPPPPPPPP...","......LL.LL.....","......QQ.QQ.....",".....KKK.KKKK...","................"],
["....PPPPPPPP....","...PPPPPPPPPP...","..PPPPPPPPPPPP..","...LL.....LL....","..QQ.....QQ.....",".KKK....KKK.....","................"]];
const STR=['#f4f4f4','#3cb043','#e8508a','#3a6fd8','#3cb043','#e8508a'], STRD=['#c8c8d0','#2a8a34','#b83a6c','#2a52a8','#2a8a34','#b83a6c'];
const OUT={
  normal:{name:'NORMAL',col:'#3cb043',legs:'pants',T:(x,y)=>STR[y-11],A:(x,y)=>STRD[y-11],P:'#4a70b8',K:'#f07830'},
  fuego:{name:'FUEGO',col:'#ff5a2a',legs:'pants',T:(x,y)=>y===11?'#ffffff':((x+y)%3===0?'#ff9a3a':'#c8321e'),A:'#eeeeee',P:'#d8bc94',K:'#b02040',
    over:g=>{R(g,2,2,2,3,'#e8202a');R(g,1,3,1,1,'#e8202a');R(g,6,11,5,1,'#ffffff');R(g,5,12,1,1,'#ffffff');}},
  vuelo:{name:'VUELO',col:'#2bd16a',legs:'skirt',T:(x,y)=>y===11?'#dcdce4':'#fafafa',A:'#e4e4ea',P:'#26262c',L:SK,Q:'#b02040',K:'#5a5a64',
    over:g=>{R(g,3,6,6,1,'#1a1a1a');R(g,9,5,5,3,'#2bd16a');R(g,9,5,5,1,'#1a6a3a');R(g,10,6,2,1,'#c8ffd8');R(g,6,13,1,1,'#802040');
      R(g,0,11,2,1,'#ffd23a');R(g,0,12,3,1,'#ffd23a');R(g,1,13,1,1,'#e0a020');}},
  hielo:{name:'HIELO',col:'#7fd8ff',legs:'skirt',T:(x,y)=>y===16?'#5ab8f0':'#fafcff',A:SK,P:(x,y)=>((x+y*2)%4===0?'#7cc8ff':'#ffffff'),L:SK,Q:'#ffffff',K:'#b8e0ff',
    over:g=>{R(g,5,1,3,1,'#7fe0ff');R(g,6,0,1,3,'#7fe0ff');R(g,6,1,1,1,'#ffffff');}},

    over:g=>{R(g,4,0,2,2,'#2a2a38');R(g,4,0,1,1,'rgba(0,0,0,0)');R(g,9,0,2,2,'#2a2a38');R(g,5,1,1,1,'#ff9ac0');R(g,9,1,1,1,'#ff9ac0');

};
const ORDER=['normal','fuego','vuelo','hielo','gata'];
let GOGGLES=null;
const SPR={};
function buildCarla(){
  GOGGLES=mk(16,24,g=>{R(g,3,6,6,1,'#1a1a1a');R(g,9,5,5,3,'#2bd16a');R(g,9,5,5,1,'#1a6a3a');R(g,10,6,2,1,'#c8ffd8');R(g,0,11,2,1,'#ffd23a');R(g,0,12,3,1,'#ffd23a');R(g,1,13,1,1,'#e0a020');});
  for(const k of ORDER){const o=OUT[k];SPR[k]=[];

// Mamá
const MUP=["................","......HHHH......","....HHHHHHHH....","...HHhHHHHHHH...","...HHHHHHHHHHH..","..HHHHHSHHSSSH..",

    if(f===2){ tpl(g,["....TTTTTTTTT...","....TTTTTTTTT...","....TTTTTTTTT...","....TTTTTTTTT..."],pal,0,14);

// Gatitos
const KIT=[[],[]];
const TAILS=[[[1,4],[0,3],[0,2],[0,1]],[[1,4],[1,3],[0,2],[0,1],[1,0]],[[1,5],[0,5],[0,4],[0,3]]];
function drawKitten(g,c1,c2,bl,fr,tail=0){
  // fr: 0-1 andar, 2 salto, 3 sentado
  if(fr===3){R(g,3,3,7,5,c1);R(g,4,3,1,2,c2);R(g,6,3,1,2,c2);R(g,4,7,6,1,bl);R(g,3,8,3,2,c1);R(g,8,6,2,4,c1);R(g,9,6,1,4,bl);}
  else{R(g,2,4,8,4,c1);R(g,3,4,1,2,c2);R(g,5,4,1,2,c2);R(g,7,4,1,2,c2);R(g,3,7,6,1,bl);}
  const hy=fr===3?0:0;
  R(g,9,1+hy,5,5,c1);R(g,9,0+hy,1,1,c1);R(g,13,0+hy,1,1,c1);R(g,11,1+hy,1,1,c2);
  R(g,10,3+hy,1,1,'#1a2a1a');R(g,12,3+hy,1,1,'#1a2a1a');R(g,10,5+hy,3,1,bl);R(g,13,4+hy,1,1,'#ff8aa0');
  const tp=fr===3?TAILS[2].map(([x,y])=>[x+1,y+2]):TAILS[tail];
  tp.forEach(([x,y],k)=>R(g,x,y,1,1,k===tp.length-1?c2:c1));
  if(fr===0){R(g,3,8,1,2,c1);R(g,8,8,1,2,c1);R(g,4,8,1,2,c2);R(g,9,8,1,2,c2);}

}
const KITT=[[],[]];

const GR=[],GRW=[],GRR=[];
function drawGrumo(g,fr){
  const B='#8040a8',D='#4e2068',L='#b070d8',X='#2a0f3a';
  for(let y=0;y<44;y++)for(let x=0;x<44;x++){const dx=(x-22)/17,dy=(y-22)/16;const a=Math.atan2(dy,dx),r=Math.hypot(dx,dy);
    const e=1+.09*Math.sin(a*13)+.04*Math.sin(a*29);
    if(r<e){let c=B;if(r>e-.13)c=X;else if(dx+dy>.55)c=D;else if(dx+dy<-.6)c=L;R(g,x,y,1,1,c);}}
  ell(g,22,30,9,6,'#c89ae0');
  R(g,9,3,3,6,'#f0e2c0');R(g,8,1,2,3,'#f0e2c0');R(g,8,0,1,1,'#d8c8a0');R(g,32,3,3,6,'#f0e2c0');R(g,34,1,2,3,'#f0e2c0');R(g,35,0,1,1,'#d8c8a0');
  R(g,12,13,7,7,'#fff');R(g,25,13,7,7,'#fff');R(g,12,15,3,4,'#111');R(g,25,15,3,4,'#111');R(g,13,15,1,1,'#fff');R(g,26,15,1,1,'#fff');
  for(let i=0;i<8;i++){R(g,11+i,10+(i>>1),1,2,X);R(g,25+i,13-(i>>1),1,2,X);}
  R(g,13,24,18,7,'#5a0a20');for(let i=0;i<4;i++){R(g,14+i*4,24,2,2,'#fff');R(g,16+i*4,29,2,2,'#fff');}R(g,19,28,6,1,'#e05070');
  if(fr===3){R(g,0,4,7,14,B);R(g,0,4,7,1,X);R(g,0,2,1,3,'#fff');R(g,3,2,1,3,'#fff');R(g,37,22,6,9,B);}
  else{R(g,0,21,6,10,B);R(g,38,21,6,10,B);R(g,0,31,1,2,'#fff');R(g,2,31,1,2,'#fff');R(g,41,31,1,2,'#fff');R(g,43,31,1,2,'#fff');}
  const a=fr===1?1:0,b=fr===0?1:0, up=fr===2?2:0;
  R(g,10,38-a-up,10,6,D);R(g,24,38-b-up,10,6,D);R(g,10,43-a-up,2,1,'#fff');R(g,24,43-b-up,2,1,'#fff');
}
function buildGrumo(){
  for(let f=0;f<4;f++){const c=mk(44,44,g=>drawGrumo(g,f));GR.push(c);

function drum(k,t,v){
  if(k==='k'){const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);const g=AC.createGain();g.gain.setValueAtTime(v*1.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g);g.connect(musG);o.start(t);o.stop(t+.15);}
  else{const s=AC.createBufferSource();s.buffer=NOISE;const f=AC.createBiquadFilter();f.type=k==='s'?'bandpass':'highpass';f.frequency.value=k==='s'?1800:7000;const g=AC.createGain();const d=k==='s'?.12:.035;
    g.gain.setValueAtTime(k==='s'?v*.9:v*.5,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(musG);s.start(t);s.stop(t+d+.01);}
}
function playNote(tk,n,t,dur){
  if(tk.w==='drum'){drum(n,t,tk.v);return;}
  const o=osc(tk.w);o.frequency.setValueAtTime(mf(n),t);const g=AC.createGain();
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(tk.v,t+.006);g.gain.linearRampToValueAtTime(tk.v*.6,t+dur*.5);g.gain.linearRampToValueAtTime(0,t+dur*.95);
  o.connect(g);g.connect(musG);o.start(t);o.stop(t+dur);
}
function music(name){wantMusic=name;if(!AC)return;cur={s:SONGS[name],start:AC.currentTime+.06,st:SONGS[name].tracks.map(()=>({i:0,step:0,loop:0}))};}
function stopMusic(){cur=null;wantMusic=null;}
setInterval(()=>{
  if(!cur||!AC)return;const s=cur.s,until=AC.currentTime+.15;let alive=false;
  s.tracks.forEach((tk,ti)=>{const st=cur.st[ti];
    for(;;){if(st.i>=tk.seq.length){if(s.loop){st.i=0;st.step=0;st.loop++;}else break;}
      const t=cur.start+(st.loop*tk.len+st.step)*s.s16;alive=true;if(t>until)break;
      const[n,l]=tk.seq[st.i];if(n!=null&&t>AC.currentTime-.05)playNote(tk,n,t,l*s.s16);st.step+=l;st.i++;}});
  if(!alive)cur=null;
},30);

/* ---------- entrada (teclado + táctil) ---------- */
const KEYS=['left','right','up','down','a','b','start','select'];
const KB={},TC={},K={},KP={};
KEYS.forEach(k=>{KB[k]=TC[k]=K[k]=false;KP[k]=false;});
function sync(k){const v=KB[k]||TC[k];if(v&&!K[k])KP[k]=true;K[k]=v;}
const KMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',
  KeyZ:'a',Space:'a',KeyK:'a',KeyX:'b',KeyJ:'b',ShiftLeft:'b',ShiftRight:'b',Enter:'start',KeyP:'start',KeyM:'select',Tab:'select'};
addEventListener('keydown',e=>{const k=KMAP[e.code];if(!k)return;e.preventDefault();firstGesture();KB[k]=true;sync(k);});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(!k)return;e.preventDefault();KB[k]=false;sync(k);});
const el={dpad:document.getElementById('dpad'),A:document.getElementById('bA'),B:document.getElementById('bB'),st:document.getElementById('bStart'),se:document.getElementById('bSel')};
let gestured=false;
function firstGesture(){initAudio();if(gestured)return;gestured=true;
  if(document.body.classList.contains('touch')){try{const d=document.documentElement;const p=d.requestFullscreen?d.requestFullscreen({navigationUI:'hide'}):null;
    if(p&&p.then)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>{});}catch(e){}}}
const latchB=new Set(),latchA=new Set();
function touches(e){
  e.preventDefault();document.body.classList.add('touch');
  const st={};KEYS.forEach(k=>st[k]=false);
  const cen=n=>{const r=n.getBoundingClientRect();return toStage(r.left+r.width/2,r.top+r.height/2);};
  const D=cen(el.dpad),cdx=D.x,cdy=D.y,dr=el.dpad.offsetWidth/2;
  const ca=cen(el.A),cb=cen(el.B),br=el.A.offsetWidth/2;
  const box=n=>{const c=cen(n),w=n.offsetWidth/2,h=n.offsetHeight/2;return{left:c.x-w,right:c.x+w,top:c.y-h,bottom:c.y+h};};
  const rs=box(el.st),rl=box(el.se);
  const inR=(r,x,y,m)=>x>r.left-m&&x<r.right+m&&y>r.top-m&&y<r.bottom+m;
  for(const t of e.touches){const sp=toStage(t.clientX,t.clientY),x=sp.x,y=sp.y;
    const dx=x-cdx,dy=y-cdy;
    if(Math.abs(dx)<dr*1.5&&Math.abs(dy)<dr*1.5&&x<SW*.45){
      if(Math.hypot(dx,dy)>dr*.16){const a=Math.atan2(dy,dx);const s=Math.PI/8;
        if(Math.abs(a)<3*s)st.right=true;if(Math.abs(a)>5*s)st.left=true;if(a>s&&a<7*s)st.down=true;if(a<-s&&a>-7*s)st.up=true;}
      continue;}
    if(inR(rs,x,y,14)){st.start=true;continue;}
    if(inR(rl,x,y,14)){st.select=true;continue;}
    const da=Math.hypot(x-ca.x,y-ca.y),db=Math.hypot(x-cb.x,y-cb.y);
    if(x>SW*.5){
      const between=Math.abs(da-db)<br*.7&&da<br*1.8&&db<br*1.8;
      let a=false,b=false;
      if(between){a=b=true;}
      else if(da<db&&da<br*2.1)a=true;
      else if(db<=da&&db<br*2.1)b=true;
      // si el dedo empezó en B y se desliza hasta A, B sigue pulsado (como en el mando NES)
      const id=t.identifier,near=da<br*2.4||db<br*2.4;
      // un dedo que ha pulsado A lo mantiene mientras siga sobre el mando A/B,
      // salvo que vuelva claramente al centro de B (como rodar el pulgar en la NES)
      if(latchA.has(id)&&near&&!(db<br*.5&&da>br*1.9))a=true;
      if(latchB.has(id)&&near)b=true;
      if(a)latchA.add(id);else latchA.delete(id);
      if(b)latchB.add(id);else latchB.delete(id);
      if(a)st.a=true;if(b)st.b=true;}
  }
  const live=new Set([...e.touches].map(t=>t.identifier));for(const id of[...latchB])if(!live.has(id))latchB.delete(id);for(const id of[...latchA])if(!live.has(id))latchA.delete(id);
  KEYS.forEach(k=>{TC[k]=st[k];sync(k);});
  el.dpad.className=(st.left?'L ':'')+(st.right?'R ':'')+(st.up?'U ':'')+(st.down?'D':'');
  el.A.classList.toggle('on',st.a);el.B.classList.toggle('on',st.b);el.st.classList.toggle('on',st.start);el.se.classList.toggle('on',st.select);
  if(e.type==='touchend')firstGesture();
}

/* ---------- colisiones ---------- */
const tileAt=(tx,ty)=>(ty<0||ty>=LH||tx<0||tx>=LW)?'.':map[ty][tx];
function solidAt(tx,ty){if(tx<0||tx>=LW)return true;if(ty<0||ty>=LH)return false;return SOLID.has(map[ty][tx]);}
function collideX(e){
  e.hitWall=0;const y0=Math.floor(e.y/T),y1=Math.floor((e.y+e.h-1)/T);
  if(e.vx>0){const tx=Math.floor((e.x+e.w-1)/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=tx*T-e.w;e.vx=0;e.hitWall=1;return;}}
  else if(e.vx<0){const tx=Math.floor(e.x/T);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*T;e.vx=0;e.hitWall=-1;return;}}
}
function collideY(e,prevBottom){
  e.onGround=false;const x0=Math.floor(e.x/T),x1=Math.floor((e.x+e.w-1)/T);
  if(e.vy>=0){const ty=Math.floor((e.y+e.h)/T);
    for(let tx=x0;tx<=x1;tx++){const c=tileAt(tx,ty);if(solidAt(tx,ty)||(c==='-'&&prevBottom<=ty*T+1)){e.y=ty*T-e.h;e.vy=0;e.onGround=true;return null;}}}
  else{const ty=Math.floor(e.y/T);let hit=null;const cx=Math.floor((e.x+e.w/2)/T);
    for(let tx=x0;tx<=x1;tx++)if(solidAt(tx,ty)){if(!hit||tx===cx)hit={tx,ty};}
    if(hit){e.y=(ty+1)*T;e.vy=0;return hit;}}
  return null;
}

/* ---------- jugador ---------- */
function hurt(){
  if(P.inv>0||P.dead||P.lock)return;
  // primer golpe: se pierde el poder de disparo; segundo: se pierde el vuelo; tercero: se pierde una vida
  if(P.outfit==='fuego'||P.outfit==='hielo'||P.outfit==='gata'){P.prev=P.outfit;P.outfit=P.canFly?'vuelo':'normal';P.flash=40;P.inv=120;sfx('hurt');}
  else if(P.canFly||P.outfit!=='normal'){P.prev=P.outfit;P.canFly=false;P.outfit='normal';P.flash=40;P.inv=120;sfx('hurt');}
  else die(false);
}
function die(pit){
  if(P.dead)return;P.dead=true;P.deadT=pit?40:0;P.vy=pit?0:-5.5;P.vx=0;stopMusic();sfx('die');
}
function afterDeath(){
  G.lives--;

  else{resetLevel();G.state='card';G.cardT=0;}
}
function power(){
  const o=P.outfit;
  if(o==='fuego'){if(proj.filter(q=>q.k==='fire').length<3){proj.push({k:'fire',x:P.x+(P.face>0?P.w:-7),y:P.y+7,w:7,h:7,vx:3.3*P.face,vy:1.5,life:110});sfx('fire');P.atk=10;P.shotCD=22;}}

  else if(o==='gata'){if(P.atk<=0){P.atk=12;proj.push({k:'claw',x:P.face>0?P.x+P.w-2:P.x-16,y:P.y+3,w:18,h:16,vx:3.8*P.face,face:P.face,life:12,hit:new Set()});sfx('claw');P.shotCD=20;}}
}

function updPlayer(){
  const p=P;
  if(p.dead){p.deadT++;if(p.deadT>30){p.vy=Math.min(p.vy+.28,6);p.y+=p.vy;}if(p.deadT>150)afterDeath();return;}
  if(p.inv>0)p.inv--;if(p.flash>0)p.flash--;if(p.atk>0)p.atk--;
  const ctl=!p.lock;
  const L=ctl&&K.left,Rt=ctl&&K.right,run=ctl&&K.b,maxv=run?2.3:1.5,acc=p.onGround?.1:.08;
  if(L&&!Rt){p.vx=Math.max(p.vx-acc,-maxv);p.face=-1;}
  else if(Rt&&!L){p.vx=Math.min(p.vx+acc,maxv);p.face=1;}
  else{const f=p.onGround?.12:.03;p.vx=p.vx>0?Math.max(0,p.vx-f):Math.min(0,p.vx+f);}
  if(Math.abs(p.vx)>maxv)p.vx*=.96;
  if(ctl&&KP.a)p.jbuf=9;
  if(p.jbuf>0){
    if(p.onGround||p.coyote>0){p.vy=-(4.85+Math.abs(p.vx)*.26);p.onGround=false;p.coyote=0;p.jbuf=0;sfx('jump');}
    else if(KP.a&&p.outfit==='gata'&&!p.dbl){p.vy=-4.7;p.dbl=true;p.jbuf=0;sfx('jump2');puff(p.x+5,p.y+22,'#ffffff',6,1);}
    else p.jbuf--;
  }
  const holdA=ctl&&K.a;
  if(!holdA&&p.vy<-2.2)p.vy*=.85;
  let gr=p.vy<0?(holdA?.185:.36):.345;
  if(Math.abs(p.vy)<.8)gr*=holdA?.7:.85;
  p.flying=false;
  if(p.canFly&&ctl&&K.a&&!p.onGround){
    if(p.fly>0&&p.vy>-.6){p.vy=Math.max(p.vy-.62,-2.4);gr=0;p.fly--;p.flying=true;if(G.frame%6===0){parts.push({x:p.x+2+Math.random()*6,y:p.y+22,vx:0,vy:1,g:0,life:16,max:16,c:'#ffffff',sz:2});sfx('fly');}}
    else if(p.vy>1.1){p.vy=1.1;gr=0;}
  }
  p.vy=Math.min(p.vy+gr,5);

  p.x+=p.vx;if(p.x<cam.min)p.x=cam.min,p.vx=Math.max(0,p.vx);collideX(p);
  const pb=p.y+p.h;p.y+=p.vy;if(p.y<14&&p.vy<0){p.y=14;p.vy=0;}const hit=collideY(p,pb);if(hit)bumpTile(hit.tx,hit.ty);
  for(const e of enemies){if(e.frozen>0&&p.vy>=0&&pb<=e.y+2&&p.y+p.h>=e.y&&p.x+p.w>e.x+1&&p.x<e.x+e.w-1){p.y=e.y-p.h;p.vy=0;p.onGround=true;}}

  if(p.y>VH+8){die(true);return;}

  p.anim+=Math.abs(p.vx)*.5;
  // rastro para los gatitos
  const l=trail[trail.length-1];if(Math.hypot(p.x+5-l.x,p.y+p.h-l.y)>=1.6){trail.push({x:p.x+5,y:p.y+p.h,g:p.onGround});if(trail.length>240)trail.shift();}
  for(const cx2 of[CHECK_X,CHECK2])if(p.x>cx2&&G.check<cx2){G.check=cx2;sfx('check');banner('¡PUNTO DE CONTROL!','#7affb0');}
}
function breakBrick(tx,ty){

function bumpTile(tx,ty){

}
function killEnemy(e,pts){e.state='fall';e.vy=-3.5;e.vx=(e.x<P.x?-1:1)*.8;e.frozen=0;addScore(pts,e.x,e.y);sfx('stomp');}

/* ---------- enemigos ---------- */
function updEnemies(){
  for(const e of enemies){
    if(!e.active){if(e.x<cam.x+VW+24)e.active=true;else continue;}
    e.anim++;
    if(e.state==='squash'){if(--e.t<=0)e.remove=true;continue;}
    if(e.state==='fall'){e.vy+=.3;e.y+=e.vy;e.x+=e.vx;if(e.y>VH+40)e.remove=true;continue;}
    if(e.frozen>0){e.frozen--;e.vy=Math.min(e.vy+.3,5);const pb=e.y+e.h;e.y+=e.vy;collideY(e,pb);if(e.y>VH+20)e.remove=true;continue;}
    if(e.type==='paloma'){e.t++;e.x+=-e.speed;e.y=e.baseY+Math.sin(e.t*.06)*14;if(e.x<cam.x-80)e.remove=true;}
    else{e.vy=Math.min(e.vy+.3,5);e.vx=e.dir*e.speed;e.x+=e.vx;collideX(e);if(e.hitWall)e.dir*=-1;const pb=e.y+e.h;e.y+=e.vy;collideY(e,pb);if(e.y>VH+40)e.remove=true;}
    if(e.x<-40)e.remove=true;
    if(!P.dead&&!P.lock&&ov(P,e)){
      if(P.vy>0&&P.y+P.h-P.vy<=e.y+6){
        P.combo++;const pts=Math.min(1600,100*Math.pow(2,P.combo-1));
        if(e.type==='paloma'){e.state='fall';e.vy=0;e.vx=0;}else{e.state='squash';e.t=30;}
        addScore(pts,e.x,e.y);sfx('stomp');P.vy=K.a?-5.6:-3.6;puff(e.x+7,e.y,'#ffffff',4,1);
      }else hurt();
    }
  }
  enemies=enemies.filter(e=>!e.remove);
}
function updProj(){
  for(const q of proj){
    q.life--;

      const tx=Math.floor((q.x+q.w/2)/T),ty=Math.floor((q.y+q.h/2)/T);if(solidAt(tx,ty)){q.dead=true;puff(q.x+3,q.y+3,'#ffa040',6,1.2);continue;}
      q.y+=q.vy;const by=Math.floor((q.y+q.h)/T);if(q.vy>0&&(solidAt(tx,by)||tileAt(tx,by)==='-')){q.y=by*T-q.h;q.vy=-3;}
      if(q.x<cam.x-20||q.x>cam.x+VW+20||q.y>VH||q.life<=0){q.dead=true;if(q.life<=0)puff(q.x+3,q.y+3,'#ffa040',4,.8);}
      for(const e of enemies)if(e.active&&(e.state==='alive')&&ov(q,e)){killEnemy(e,200);q.dead=true;puff(q.x,q.y,'#ffa040',6,1.2);break;}
      if(boss&&ov(q,boss)){q.dead=true;puff(q.x,q.y,'#ffa040',8,1.5);hitBoss(1);}}
    else if(q.k==='ice'){q.x+=q.vx;const tx=Math.floor((q.x+q.w/2)/T),ty=Math.floor((q.y+q.h/2)/T);
      if(solidAt(tx,ty)||q.life<=0){q.dead=true;puff(q.x+5,q.y+3,'#bff0ff',6,1.2);continue;}
      for(const e of enemies)if(e.active&&e.state==='alive'&&ov(q,e)){e.ih=(e.ih||0)+1;q.dead=true;puff(q.x,q.y,'#bff0ff',8,1.3);sfx('ice');if(e.ih>=3){killEnemy(e,200);}else{e.frozen=420;e.vy=0;addScore(100,e.x,e.y);}break;}
      if(boss&&ov(q,boss)){q.dead=true;puff(q.x,q.y,'#bff0ff',8,1.5);hitBoss(.75);}}
    else if(q.k==='claw'){q.x+=q.vx;
      const tx=Math.floor((q.x+q.w/2)/T);for(const ty of[Math.floor((q.y+2)/T),Math.floor((q.y+q.h-2)/T)])if(tileAt(tx,ty)==='B')breakBrick(tx,ty);
      for(const e of enemies)if(e.state==='alive'&&e.active&&ov(q,e)&&!q.hit.has(e)){q.hit.add(e);killEnemy(e,200);}
      if(boss&&!q.hit.has(boss)&&ov(q,boss)){q.hit.add(boss);puff(q.x+9,q.y+8,'#ff9ac0',8,1.5);hitBoss(1.5);}
      const cy=Math.floor((q.y+q.h/2)/T);if(q.life<=0||solidAt(tx,cy)){q.dead=true;puff(q.x+9,q.y+8,'#ffffff',5,1);}}
    else if(q.k==='tiza'){q.vy+=.25;q.x+=q.vx;q.y+=q.vy;if(q.y>VH+10)q.dead=true;
      if(q.x<A0*T-10||q.x>LW*T)q.dead=true;if(!P.dead&&ov(q,P)){hurt();q.dead=true;}}
    else if(q.k==='wave'){q.x+=q.vx;if(q.life<=0||q.x<A0*T||q.x>LW*T)q.dead=true;if(!P.dead&&ov(q,P)){hurt();}}
  }
  proj=proj.filter(q=>!q.dead&&q.life>-999);
}

function updParts(){

function catBox(c){return{x:c.x-5,y:c.y-9,w:10,h:9,vx:c.vx,vy:c.vy};}
function catTeleport(c,i){c.x=P.x+5-P.face*(14+14*i);c.y=P.y+P.h-20;c.vx=0;c.vy=0;c.onGround=false;puff(c.x,c.y-4,'#ffffff',5,1,0,18);}
function updCats(){
  cats.forEach((c,i)=>{
    const pf=P.face||1;let tx=P.x+5-pf*(16+15*i);if(G.bossOn)tx=Math.max(tx,cam.min+10);
    const dx=tx-c.x,dist=Math.abs(dx);
    // teletransporte de rescate si se quedan muy atrás o caen a un hoyo
    if(c.y>VH+10||Math.abs(P.x-c.x)>VW*.65||(G.bossOn&&c.x<cam.min-2)){if(!P.dead)catTeleport(c,i);return;}
    const want=dist>6&&!P.dead?Math.sign(dx)*Math.min(2.7,.6+dist*.05):0;
    c.vx+=(want-c.vx)*(c.onGround?.25:.08);
    if(Math.abs(c.vx)>.15)c.face=Math.sign(c.vx);
    // saltar obstáculos y huecos, o seguir a Carla hacia arriba
    if(c.onGround&&Math.abs(c.vx)>.3){
      const dir=Math.sign(c.vx),nx=Math.floor((c.x+dir*9)/T),fy=Math.floor((c.y-1)/T);
      let h=0;while(h<5&&solidAt(nx,fy-h))h++;
      const gap=!solidAt(nx,Math.floor(c.y/T))&&tileAt(nx,Math.floor(c.y/T))!=='-';
      const above=P.onGround&&P.y+P.h<c.y-12&&dist<40;
      if(h>0||above)c.vy=-Math.min(7.6,Math.sqrt(2*.35*((h?h*T:c.y-(P.y+P.h))+10)));
      else if(gap&&dist>20)c.vy=-5;
      if(c.vy<0){c.onGround=false;c.vx=dir*Math.max(Math.abs(c.vx),1.8);}
    }
    c.vy=Math.min(c.vy+.35,5);
    const b=catBox(c);b.x+=b.vx;collideX(b);if(b.hitWall&&c.onGround)c.stuck++;else c.stuck=0;
    const pb=b.y+b.h;b.y+=b.vy;collideY(b,pb);
    c.x=b.x+5;c.y=b.y+9;c.vx=b.vx;c.vy=b.vy;c.onGround=b.onGround;
    if(c.stuck>50){catTeleport(c,i);c.stuck=0;}
    if(Math.abs(c.vx)>.2&&c.onGround){c.anim+=Math.abs(c.vx)*.6;c.idle=0;}else if(c.onGround)c.idle++;
    // gestos en reposo: mirar atrás de vez en cuando
    if(c.idle>90&&c.look<=0&&((G.frame+c.seed)%170===0))c.look=45;
    if(c.look>0)c.look--;
  });
}

function startBoss(){

}
function makeBoss(){return{x:(A0+17)*T,y:-70,w:34,h:38,vx:0,vy:0,hp:9,max:9,state:'enter',t:0,face:-1,inv:0,anim:0,seq:0,onGround:false,hitWall:0};}
function* bossIntro(){

  yield* say([{n:'GRUMO',t:'¡GRRR! ¡NO VAS A LLEVARTE A TU MAMÁ, NIÑA!'},{n:'CARLA',t:'¡DEVUÉLVEMELA AHORA MISMO, MONSTRUO!'},{n:'MAMÁ',t:'¡SALTA SOBRE SU CABEZA, CARLA!'}]);
  P.lock=false;music('boss');G.state='play';
}
function hitBoss(n){
  const b=boss;if(!b||b.inv>0||b.state==='dying'||b.state==='enter')return false;
  b.hp-=n;b.inv=50;sfx('bosshit');shake(6);puff(b.x+17,b.y+10,'#d8a0ff',10,2);
  if(b.hp<=0){b.state='dying';b.t=0;stopMusic();addScore(5000,b.x,b.y);proj=proj.filter(q=>q.k!=='tiza'&&q.k!=='wave');P.lock=true;}
  return true;
}
function nextBossMove(){
  const b=boss,ph2=b.hp<=b.max/2;const s=['walk','throw','walk','jump'][b.seq++%4];b.state=s;b.face=P.x<b.x?-1:1;
  if(s==='walk')b.t=ph2?70:100;
  if(s==='throw')b.t=50;
  if(s==='jump'){b.vy=ph2?-7.5:-6.8;b.vx=clamp((P.x-b.x)/48,-3,3);b.onGround=false;}
}
function updBoss(){
  const b=boss;if(!b)return;b.anim++;if(b.inv>0)b.inv--;
  if(b.state==='dying'){b.t++;if(b.t%5===0)puff(b.x+Math.random()*34,b.y+Math.random()*38,['#ffe040','#ff8a3a','#d8a0ff','#ffffff'][b.t%4],8,2.2,0,24);
    if(b.t%12===0)sfx('boom');if(b.t%20===0)shake(5);if(b.t>150){puff(b.x+17,b.y+19,'#ffffff',30,3,0,40);boss=null;G.state='cine';G.co=endScript();}return;}
  const ph2=b.hp<=b.max/2;
  b.vy=Math.min(b.vy+.3,7);
  if(b.state==='idle'){b.vx*=.8;if(--b.t<=0)nextBossMove();}
  else if(b.state==='walk'){b.face=P.x<b.x?-1:1;b.vx=b.face*(ph2?1.5:.9);if(--b.t<=0){b.state='idle';b.t=20;}}
  else if(b.state==='throw'){b.vx=0;b.t--;if(b.t===25){const n=ph2?5:3;for(let i=0;i<n;i++)proj.push({k:'tiza',x:b.x+17,y:b.y+4,w:6,h:6,vx:b.face*(.9+i*.6),vy:-4.2-i*.3,life:400});sfx('throw');}
    if(b.t<=0){b.state='idle';b.t=30;}}
  b.x+=b.vx;collideX(b);
  const wasAir=!b.onGround,pb=b.y+b.h;b.y+=b.vy;collideY(b,pb);
  if(b.onGround&&wasAir){
    if(b.state==='enter'){shake(25);sfx('land');b.state='idle';b.t=40;}
    else if(b.state==='jump'){shake(16);sfx('land');for(const d of[-1,1])proj.push({k:'wave',x:b.x+17-5+d*14,y:144-9,w:10,h:9,vx:d*(ph2?2.6:2),life:120});b.state='idle';b.t=ph2?25:40;}
  }
  if(!P.dead&&!P.lock&&ov(P,{x:b.x+3,y:b.y+3,w:b.w-6,h:b.h-3})){
    if(P.vy>0&&P.y+P.h-P.vy<=b.y+12){hitBoss(1);P.vy=-6;sfx('stomp');}
    else if(P.inv<=0){hurt();P.vx=(P.x<b.x?-2.5:2.5);}
  }
}

/* ---------- bucle principal ---------- */
function update(){
  G.frame++;
  if(KP.select&&G.state!=='title'){muted=!muted;if(master)master.gain.value=muted?0:.55;banner(muted?'SONIDO: NO':'SONIDO: SÍ');}
  if(G.msgT>0)G.msgT--;
  if(cam.shake>0)cam.shake--;
  switch(G.state){
    case'title':G.tcam+=.4;if(KP.start||KP.a){initAudio();shufflePowers();resetLevel();G.state='intro';G.co=introScript();}break;
    case'intro':
      if(KP.start){dlg=null;G.actors=null;G.co=null;G.fade=0;startCard();break;}
      if(dlg)updDlg();
      if(G.co&&G.co.next().done)G.co=null;updCats0();break;
    case'card':if(++G.cardT>150){G.state='play';G.fade=0;music('level');}break;
    case'play':
      if(KP.start){G.state='pause';sfx('pause');break;}
      updPlayer();updEnemies();updProj();updItems();updBoss();updParts();updCats();updCam();
      if(!G.bossOn&&!P.dead&&P.onGround&&P.x>(A0+2)*T)startBoss();
      break;
    case'pause':if(KP.start){G.state='play';sfx('pause');}break;
    case'cine':
      if(dlg)updDlg();
      if(G.co&&G.co.next().done)G.co=null;
      if(G.state==='cine'||G.state==='play'){updPlayer();updProj();updParts();updCats();updCam();if(boss&&boss.state==='dying')updBoss();if(G.hearts&&G.frame%10===0)parts.push({heart:true,x:P.x+(Math.random()*30-10),y:P.y,vx:(Math.random()-.5)*.4,vy:-.6,g:0,life:70,max:70});}
      break;
    case'over':G.overT++;if(G.overT>90&&(KP.start||KP.a))toTitle();break;
  }
  KEYS.forEach(k=>KP[k]=false);
}

  const sa=navigator.standalone||(window.matchMedia&&(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches));
  if(sa&&screen.width&&screen.height){const a=Math.min(screen.width,screen.height),b=Math.max(screen.width,screen.height);if(h>=w){w=a;h=b;}else{w=b;h=a;}}
  // en vertical, el juego se muestra girado para verse siempre en horizontal
  ROT=h>w;SCRW=w;SW=ROT?h:w;SH=ROT?w:h;
  stage.style.width=SW+'px';stage.style.height=SH+'px';stage.style.transform=ROT?'translateX('+w+'px) rotate(90deg)':'none';
  stage.style.setProperty('--u',(SH/100)+'px');
  VW=clamp(Math.round(VH*SW/SH),240,440);cv.width=VW;cv.height=VH;ctx.imageSmoothingEnabled=false;
  cv.style.width=SW+'px';cv.style.height=SH+'px';
  const cs=getComputedStyle(document.getElementById('probe'));const pv=k=>parseFloat(cs[k])||0;
  SAFE_L=Math.ceil((ROT?pv('paddingTop'):pv('paddingLeft'))*VH/SH);SAFE_R=Math.ceil((ROT?pv('paddingBottom'):pv('paddingRight'))*VH/SH);
}
